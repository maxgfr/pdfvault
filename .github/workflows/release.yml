name: Release

# Conventional-Commit releases once CI is green on main.
#   release   builds the wasm once, runs semantic-release (feat → minor,
#             fix → patch, ! → major): GitHub release, and npm when the
#             repository variable NPM_PUBLISH is "true" (trusted publishing,
#             no token stored here).
#   binaries  compiles the standalone CLI per OS from that same wasm, macOS
#             ones on macOS where they are re-signed, attests and attaches them.
#   checksums writes SHA256SUMS for the attached binaries.
# maxgfr/homebrew-tap picks the binaries up from the release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  WASM_PACK_VERSION: 0.15.0

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ env.WASM_PACK_VERSION }}
      - run: command -v wasm-pack || cargo install wasm-pack --locked --version "$WASM_PACK_VERSION"
      - run: bun install --frozen-lockfile
      - run: bun run fetch-models
      - run: bun run build:wasm
      - name: semantic-release
        id: release
        run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/commit-analyzer@13.0.1
          -p @semantic-release/release-notes-generator@14.1.1
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/npm@13.2.0
          -p @semantic-release/github@12.0.10
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
      - name: Hand the exact engine to the binary builds
        if: steps.release.outputs.published == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine
          path: |
            packages/engine/wasm
            models
          retention-days: 3

  binaries:
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-latest
            targets: macos-arm64 macos-x64
          - runner: ubuntu-latest
            targets: linux-x64 linux-arm64 windows-x64 windows-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine
      - run: bun scripts/cli-binaries.ts --version "$VERSION" ${{ matrix.targets }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/cli/dist/bin/pdfvault-*
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "v$VERSION" packages/cli/dist/bin/pdfvault-* --clobber
      - run: (cd packages/cli/dist/bin && shasum -a 256 -- pdfvault-*) > "sums-${{ matrix.runner }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums-${{ matrix.runner }}
          path: sums-${{ matrix.runner }}.txt

  checksums:
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sums-*
          merge-multiple: true
      - run: |
          cat sums-*.txt | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
