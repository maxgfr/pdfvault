name: CI

# Every gate on every push: Rust (fmt, clippy, tests with qpdf --check,
# cargo deny), TypeScript (tsc, oxlint, bun test), the site build and its
# no-network check, the CLI binary, Playwright end to end, a short fuzz run,
# and osv-scanner. The site artifact built here is what Pages deploys.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: 0.15.0

jobs:
  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: qpdf (validates every PDF the tests write)
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch-models.ts', 'packages/engine/src/models.ts') }}
      - run: bun scripts/fetch-models.ts
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p pdfvault-wasm-core -p pdfvault-wasm-render -p pdfvault-wasm-ocr -- -D warnings
      - run: cargo test --workspace
      - name: cargo deny
        run: |
          curl -sSfL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | tar xz
          ./cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny check

  web:
    name: Engine, CLI, site, end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: sudo apt-get update && sudo apt-get install -y qpdf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ env.WASM_PACK_VERSION }}
      - run: command -v wasm-pack || cargo install wasm-pack --locked --version "$WASM_PACK_VERSION"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-${{ hashFiles('scripts/fetch-models.ts', 'packages/engine/src/models.ts') }}
      - run: bun install --frozen-lockfile
      - run: bun run fetch-models
      - run: bun run build:wasm
      - run: bun run fixtures
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Build the site
        run: bun run build:web
      - name: Privacy gate (no external origin in the bundle)
        run: bun run check:network
      - name: CLI binary, tested as shipped
        run: |
          bun scripts/cli-binaries.ts linux-x64
          PDFVAULT_BIN=packages/cli/dist/bin/pdfvault-linux-x64 bun test packages/cli
      - run: bunx playwright install --with-deps chromium
      - name: End to end, parity checked against the binary
        run: bun run e2e
        env:
          PDFVAULT_BIN: packages/cli/dist/bin/pdfvault-linux-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: packages/web/dist
          include-hidden-files: true
          retention-days: 7

  fuzz:
    name: Fuzz the PDF parser (60 s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install && rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Seed corpus from the generated fixtures
        run: cargo run -q -p pdfvault-fixtures -- fuzz/corpus/parse
      - run: cargo +nightly fuzz run parse corpus/parse -- -max_total_time=60 -rss_limit_mb=2048
        working-directory: fuzz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash
          path: fuzz/artifacts

  osv:
    name: Known vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --lockfile=bun.lock
