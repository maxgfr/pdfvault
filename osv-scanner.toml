# osv-scanner (CI): the advisories deny.toml ignores, with the same reasons.
# All are reached only through office2pdf (pdfvault-office, its own lazy wasm module).

[[IgnoredVulns]]
id = "RUSTSEC-2026-0194"
reason = "quick-xml 0.38.4 via typst-library -> hayagriva -> citationberg, which parses CSL styles for Typst bibliographies: office2pdf never emits one and its Typst world serves no file but its own source and images, so only Typst's bundled CSL data reaches it, never user input"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0195"
reason = "quick-xml 0.38.4 NsReader via typst-library -> hayagriva -> citationberg; same path as RUSTSEC-2026-0194, Typst's bundled CSL data only"

