[package]
name = "pdfvault-render"
description = "Page rasterization, text extraction and visual diff for pdfvault (hayro)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pdfvault-core.workspace = true
hayro.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pdfvault-core = { workspace = true, features = ["fixtures"] }
