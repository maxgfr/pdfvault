[package]
name = "pdfvault-ocr"
description = "Multilingual OCR for pdfvault (PP-OCRv6 on rten), run entirely on device."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rten.workspace = true
rten-tensor.workspace = true
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
pdfvault-core = { workspace = true, features = ["fixtures"] }
pdfvault-render.workspace = true
