[package]
name = "pdfvault-core"
description = "PDF and image engine behind pdfvault: compression, page tools, security, forms, metadata."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lopdf.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
jpeg-encoder = "0.7"
miniz_oxide = "0.9"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crc32fast = "1"
color_quant = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }
hayro-cmap = { version = "0.1", default-features = false }
harfrust = { version = "0.15", optional = true }
skrifa = { version = "0.49", default-features = false, features = ["std"], optional = true }
subsetter = { version = "0.2", default-features = false, optional = true }
unicode-bidi = { version = "0.3", optional = true }


[features]
fixtures = []
# Writing text in any script (shaping, font subsetting) for the editor and
# for Markdown → PDF.
# The wasm module turns it on; without it, edits that write text fail.
typeset = ["dep:harfrust", "dep:skrifa", "dep:subsetter", "dep:unicode-bidi"]
