[package]
name = "pdfvault-office"
description = "Word, Excel and PowerPoint to PDF for pdfvault (office2pdf, Typst)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
pdfvault-core.workspace = true
office2pdf = { version = "0.11", default-features = false }
# The same zip office2pdf already builds; no second copy.
zip = { version = "9", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pdfvault-core = { workspace = true, features = ["fixtures"] }
