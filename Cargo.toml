[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/maxgfr/pdfvault"
rust-version = "1.92"

[workspace.dependencies]
pdfvault-core = { path = "crates/core" }
pdfvault-render = { path = "crates/render" }
pdfvault-ocr = { path = "crates/ocr" }
lopdf = { version = "0.45", default-features = false, features = ["wasm_js"] }
hayro = { version = "0.8", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
rten = { version = "0.26", default-features = false, features = ["rten_format"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Tests decode images and run OCR; optimized dependencies keep them fast.
[profile.dev.package."*"]
opt-level = 2
